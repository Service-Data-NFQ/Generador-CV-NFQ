<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Generador de CV - Nfq</title>
    <style>
        body,
        html {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .left-panel {
            width: 50%;
            padding: 30px;
            overflow-y: auto;
            background: #fff;
            border-right: 2px solid #000;
            box-sizing: border-box;
        }

        .right-panel {
            width: 50%;
            background: #525659;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .top-bar h2 {
            margin: 0;
            color: #333;
        }

        /* Botones */
        .btn-crear {
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-crear:hover {
            background: #333;
        }

        .btn-secundario {
            padding: 10px 20px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
            transition: 0.3s;
        }

        .btn-secundario:hover {
            background: #f0f0f0;
        }

        /* Formularios */
        .section-form {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .section-title {
            margin-top: 0;
            font-size: 16px;
            text-transform: uppercase;
            border-bottom: 1px solid #ccc;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
            text-transform: capitalize;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .array-item {
            border-left: 3px solid #000;
            padding-left: 10px;
            margin-bottom: 15px;
        }

        /* Modal (Ventana flotante) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin-top: 0;
        }

        .modal-content textarea {
            width: 100%;
            height: 250px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .modal-actions {
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- Ventana flotante oculta para pegar el JSON -->
    <div class="modal-overlay" id="json-modal">
        <div class="modal-content">
            <h3>Pegar contenido JSON</h3>
            <p style="font-size: 12px; color: #666;">Pega aquí el texto de tu JSON. Reemplazará los datos actuales del
                formulario.</p>
            <textarea id="json-textarea" placeholder='{\n  "candidato": {\n    "nombre": "Ejemplo"\n  }\n}'></textarea>
            <div class="modal-actions">
                <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-crear" onclick="cargarJSON()">Actualizar CV</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="top-bar">
                <h2>Datos del CV</h2>
                <div>
                    <!-- Nuevo Botón -->
                    <button class="btn-secundario" onclick="abrirModal()">Importar JSON</button>
                    <button class="btn-crear" id="btn-crear" onclick="generarCV(true)">Descargar CV</button>
                </div>
            </div>
            <div id="form-container"></div>
        </div>
        <div class="right-panel">
            <!-- Visor -->
            <iframe id="pdf-viewer" src="" title="Vista previa del CV"></iframe>
        </div>
    </div>

    <script>
        // Cambié const por let para poder reescribir todo el objeto cuando pegamos un JSON nuevo
        let cvData = {
            "candidato": { "nombre": "Juan Pérez Hernández", "anos_experiencia": "5 años" },
            "experiencia_profesional": [
                { "posicion": "Consultor Senior", "compania": "Nfq", "modalidad": "Híbrida", "fecha_inicio": "Enero 2022", "fecha_fin": "Presente", "descripcion": "Liderazgo en proyectos digitales." }
            ],
            "complementos": ["Certificación AWS"],
            "habilidades": ["Liderazgo"],
            "hard_skills": ["Python", "SQL"],
            "educacion": [
                { "universidad": "UNAM", "grado": "Ingeniería en Computación", "fecha_inicio": "2013", "fecha_fin": "2017" }
            ],
            "idiomas": ["Español - Nativo"]
        };

        function renderForm(data) {
            const container = document.getElementById('form-container');
            container.innerHTML = '';
            for (const key in data) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section-form';
                sectionDiv.innerHTML = `<h3 class="section-title">${key.replace(/_/g, ' ')}</h3>`;
                const value = data[key];

                if (typeof value === 'object' && !Array.isArray(value)) {
                    for (const subKey in value) {
                        sectionDiv.appendChild(createInputGroup(subKey, value, subKey));
                    }
                } else if (Array.isArray(value)) {
                    value.forEach((item, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'array-item';
                        if (typeof item === 'object') {
                            for (const subKey in item) { itemDiv.appendChild(createInputGroup(subKey, item, subKey)); }
                        } else {
                            itemDiv.appendChild(createInputGroup(`Item ${index + 1}`, value, index));
                        }
                        sectionDiv.appendChild(itemDiv);
                    });
                }
                container.appendChild(sectionDiv);
            }
        }

        function createInputGroup(label, objRef, key) {
            const group = document.createElement('div');
            group.className = 'form-group';
            group.innerHTML = `<label>${label.replace(/_/g, ' ')}</label>`;

            const isLong = label.toLowerCase() === 'descripcion' || (typeof objRef[key] === 'string' && objRef[key].length > 50);
            const input = document.createElement(isLong ? 'textarea' : 'input');
            if (!isLong) input.type = 'text';
            input.value = objRef[key];

            input.oninput = (e) => { objRef[key] = e.target.value; };

            group.appendChild(input);
            return group;
        }

        // --- NUEVAS FUNCIONES PARA EL MODAL JSON ---
        function abrirModal() {
            document.getElementById('json-modal').style.display = 'flex';
            // Opcional: pre-cargar el JSON actual en la caja de texto para verlo
            document.getElementById('json-textarea').value = JSON.stringify(cvData, null, 2);
        }

        function cerrarModal() {
            document.getElementById('json-modal').style.display = 'none';
        }

        function cargarJSON() {
            const jsonText = document.getElementById('json-textarea').value;
            try {
                // Intentamos convertir el texto pegado en un objeto JavaScript
                const newData = JSON.parse(jsonText);

                // Actualizamos los datos principales
                cvData = newData;

                // 1. Redibujamos todas las cajas de texto de la izquierda
                renderForm(cvData);

                // 2. Cerramos la ventana flotante
                cerrarModal();

                // 3. Mandamos a regenerar el PDF inmediatamente
                generarCV(false);

            } catch (error) {
                // Si el usuario pega algo mal escrito (falta una coma o comillas)
                alert("Hubo un error leyendo el JSON. Verifica que la sintaxis sea correcta.\n\nDetalle: " + error.message);
            }
        }
        // -------------------------------------------

        let pdfPreviewUrl = null;
        window.onload = () => { renderForm(cvData); generarCV(false); };

        async function generarCV(descargar) {
            const btn = document.getElementById('btn-crear');
            btn.disabled = true;
            btn.textContent = "Generando PDF...";
            try {
                const respuesta = await fetch('/api/generar-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cvData)
                });
                if (!respuesta.ok) {
                    const error = await respuesta.json().catch(() => ({}));
                    throw new Error(error.detail || `Error HTTP ${respuesta.status}`);
                }
                const pdf = await respuesta.blob();
                const nuevaUrl = URL.createObjectURL(pdf);
                document.getElementById('pdf-viewer').src = nuevaUrl;
                if (pdfPreviewUrl) URL.revokeObjectURL(pdfPreviewUrl);
                pdfPreviewUrl = nuevaUrl;

                if (descargar) {
                    const enlace = document.createElement('a');
                    enlace.href = nuevaUrl;
                    enlace.download = 'CV.pdf';
                    document.body.appendChild(enlace);
                    enlace.click();
                    enlace.remove();
                }
            } catch (error) {
                alert('No se pudo generar el PDF: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Descargar CV";
            }
        }
    </script>
</body>

</html>
